    const shadowTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,shadowTex);gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,2048,2048,0,gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);
    for(const f of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,f,gl.NEAREST);
    for(const f of [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,f,gl.CLAMP_TO_EDGE);
    const shadowFbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,shadowFbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,shadowTex,0);gl.drawBuffers([gl.NONE]);gl.readBuffer(gl.NONE);

    const lineVao=gl.createVertexArray(),lineBuffer=gl.createBuffer();gl.bindVertexArray(lineVao);gl.bindBuffer(gl.ARRAY_BUFFER,lineBuffer);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
    const grid=[];
    for(let x=Math.floor(lo[0])-1;x<=Math.ceil(hi[0])+1;x++)grid.push(x,groundY+.005,Math.floor(lo[2])-1,x,groundY+.005,Math.ceil(hi[2])+1);
    for(let z=Math.floor(lo[2])-1;z<=Math.ceil(hi[2])+1;z++)grid.push(Math.floor(lo[0])-1,groundY+.005,z,Math.ceil(hi[0])+1,groundY+.005,z);
    let yaw=.68,pitch=.28,zoom=1,selected='',cutaway=false,showGrid=false,shadowDirty=true,queued=false,currentView='iso',fg=[.2,.25,.22],bg=[.93,.94,.91];
    const hidden=new Set(data.cutaway_hide||[]),visible=m=>!(cutaway&&hidden.has(m.name));
    const names=data.group_labels||{};
    for(const m of meshes){const option=document.createElement('option');option.value=m.name;option.textContent=names[m.name]||m.name.replaceAll('_',' ');picker.appendChild(option);}
    function detail(){root.querySelector('[data-detail]').textContent=selected?(names[selected]||selected.replaceAll('_',' '))+(cutaway&&hidden.has(selected)?' · 剖视中隐藏':''):(cutaway?'剖视 · 查看炉内床层与布风结构':(data.subtitle||'独立流化床燃烧室'));}
    function requestRender(){if(!queued){queued=true;requestAnimationFrame(render);}}

    function render(){

      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,atlasTex);gl.uniform1i(U.Atlas,0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,shadowTex);gl.uniform1i(U.Shadow,1);

      root.dataset.ready='true';root.dataset.view=[yaw,pitch,zoom].map(v=>v.toFixed(4)).join(',');root.dataset.cutaway=String(cutaway);root.dataset.selected=selected;
    }
    function setView(name){
      const views={iso:[.68,.28],front:[0,0],back:[Math.PI,0],top:[0,1.568]};if(!views[name])throw Error('Unknown view: '+name);
      [yaw,pitch]=views[name];zoom=1;currentView=name;
      for(const b of root.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===name));requestRender();
    }

    function setSelected(value){selected=data.meshes[value]?value:'';picker.value=selected;detail();requestRender();}
    function theme(){

      function rgb(variable,fallback){const probe=document.createElement('span');probe.style.color=`var(${variable},${fallback})`;root.appendChild(probe);const value=getComputedStyle(probe).color;probe.remove();const c=document.createElement('canvas');c.width=c.height=1;const ctx=c.getContext('2d');ctx.fillStyle=value;ctx.fillRect(0,0,1,1);return Array.from(ctx.getImageData(0,0,1,1).data).slice(0,3).map(v=>v/255);}

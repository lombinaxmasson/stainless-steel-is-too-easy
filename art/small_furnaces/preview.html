<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSITE · Small AOD & VAR</title><style>:root { color-scheme:light dark; --background:light-dark(#eeeee8,#202524); --foreground:light-dark(#26302d,#e4e7de); --border:light-dark(#c3c9bf,#4a5550); --primary:light-dark(#34483e,#d2dfb4); --primary-foreground:light-dark(#fafaf4,#202a24); }
* { box-sizing:border-box; }
body { margin:0 auto; padding:24px; max-width:1200px; font:14px/1.5 system-ui,sans-serif; background:var(--background); color:var(--foreground); }
.viz-row,.viz-controls { display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin:8px 0; }
.viz-row { justify-content:space-between; }
.text-small { font-size:12px; }
.btn,.form-select { border:1px solid var(--border); background:var(--background); color:var(--foreground); padding:6px 12px; border-radius:5px; font:inherit; cursor:pointer; }
.form-label,.form-check { display:inline-flex; align-items:center; gap:8px; }
.form-check-input { accent-color:var(--primary); }
@media(max-width:480px) { body { padding:12px; } .form-label { flex-wrap:wrap; } }
</style></head><body>
<div id="ssite-small-furnaces">
  <div class="viz-row">
    <span class="viz-row"><button class="btn" type="button" data-machine="aod" aria-pressed="true">小型 AOD</button><button class="btn" type="button" data-machine="var" aria-pressed="false">VAR 电弧炉</button></span>
    <span data-finish-field><label class="form-label">炉壳材料 <select class="form-select" data-finish aria-label="AOD 炉壳材料"></select></label></span>
    <span class="text-small">拖动旋转 · 滚轮缩放 · 点选端口</span>
  </div>
  <div class="aod-stage">
    <canvas aria-label="小型 AOD 与 VAR 模型，可切换机器、拖动旋转、开盖并检查底面和四侧平面"></canvas>
    <div class="aod-labels" aria-hidden="true"></div>
    <div class="aod-error" role="status"></div>
  </div>
  <div class="viz-controls">
    <button class="btn" type="button" data-view="iso">全貌</button>
    <button class="btn" type="button" data-view="bottom">底面</button>
    <button class="btn" type="button" data-view="sides">四侧</button>
    <button class="btn" type="button" data-lid aria-pressed="false">开盖投料</button>
    <label class="form-check"><input class="form-check-input" type="checkbox" data-ports><span class="form-check-label">连接面与网格</span></label>
  </div>
  <div class="viz-controls">
    <label class="form-label">查看连接面 <select class="form-select" data-port aria-label="选择连接面"></select></label>
    <span class="text-small" data-count></span>
  </div>
  <div class="text-small aod-detail" aria-live="polite"></div>
</div>
<style>
#ssite-small-furnaces { width:100%; color:var(--foreground); }
#ssite-small-furnaces .aod-stage { position:relative; width:100%; height:clamp(350px,65vw,540px); overflow:hidden; }
#ssite-small-furnaces canvas { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
#ssite-small-furnaces canvas:active { cursor:grabbing; }
#ssite-small-furnaces .aod-labels { position:absolute; inset:0; pointer-events:none; }
#ssite-small-furnaces .aod-port-label { position:absolute; transform:translate(-50%,-50%); color:var(--foreground); background:var(--background); padding:2px 5px; border:1px solid var(--border); white-space:nowrap; }
#ssite-small-furnaces .aod-port-label.selected { color:var(--primary-foreground); background:var(--primary); }
#ssite-small-furnaces .aod-detail { min-height:2.6em; padding-top:8px; overflow-wrap:anywhere; }
#ssite-small-furnaces .aod-error { position:absolute; inset:40% 10% auto; color:var(--foreground); }

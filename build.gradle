plugins {
    id 'base'
}

tasks.register('compileBoth') {
    group = 'build'
    description = 'Compile and test the Forge 1.20.1 and NeoForge 1.21.1 projects.'
    dependsOn ':forge:compileJava', ':neoforge:compileJava', ':forge:unitTest', ':neoforge:unitTest'
    dependsOn ':forge:fluidizedBedTest', ':neoforge:fluidizedBedTest',
            ':forge:fluidizedBedRenderTest', ':neoforge:fluidizedBedRenderTest'
    dependsOn ':forge:heatTransportTest', ':neoforge:heatTransportTest'
    dependsOn ':forge:irradiationReactorTest', ':neoforge:irradiationReactorTest'
    dependsOn ':forge:fiberProbeTest', ':neoforge:fiberProbeTest'
    dependsOn ':forge:advancedProcessTest', ':neoforge:advancedProcessTest'
    dependsOn ':forge:powderBedTest', ':neoforge:powderBedTest'
    dependsOn ':forge:processEnvironmentTest', ':neoforge:processEnvironmentTest'
    dependsOn ':forge:engineeringMaterialTest', ':neoforge:engineeringMaterialTest'
    dependsOn ':forge:utilityTest', ':neoforge:utilityTest'
    dependsOn ':forge:gasFieldTest', ':neoforge:gasFieldTest'
    dependsOn ':forge:coalGasifierTest', ':neoforge:coalGasifierTest'
    dependsOn ':forge:chemicalLoopingTest', ':neoforge:chemicalLoopingTest',
            ':forge:chemicalLoopingRenderTest', ':neoforge:chemicalLoopingRenderTest'
    dependsOn ':forge:materialReport', ':neoforge:materialReport'
    dependsOn ':forge:materialReportTest', ':neoforge:materialReportTest'
}

tasks.register('materialReport') {
    group = 'documentation'
    description = 'Generate material-use reports for both loaders without starting Minecraft.'
    dependsOn ':forge:materialReport', ':neoforge:materialReport'
}

tasks.named('assemble').configure {
    dependsOn ':forge:assemble', ':neoforge:assemble'
}
tasks.named('build').configure {
    dependsOn ':forge:build', ':neoforge:build'
}
tasks.named('clean').configure {
    dependsOn ':forge:clean', ':neoforge:clean'
}

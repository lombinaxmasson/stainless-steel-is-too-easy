plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-1.21.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
sourceSets.test {
    java.srcDir rootProject.file('common/src/test/java')
    compileClasspath += sourceSets.main.compileClasspath
}

apply from: rootProject.file('gradle/gt6ce-sdk.gradle')

def neoApi = resolveGt6ce("api/common/build/libs/gt6ce-api-${gt6ce_api_version}.jar")
def neoSdk = resolveGt6ce("minecraft/versions/1.21.1-neoforge/build/addon-sdk/gt6ce-addon-sdk-1.21.1-neoforge-${gt6ce_api_version}.jar")
def neoRuntime = resolveGt6ce("minecraft/versions/1.21.1-neoforge/build/libs/gt6ce-neoforge-1.21.1-${gt6ce_version}.jar")

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly files(neoApi, neoSdk)
    testImplementation files(neoApi, neoSdk)
    if (neoRuntime.isFile()) {
        runtimeOnly files(neoRuntime)
    }
}

tasks.register('requireSdk') {
    description = 'Fail with the SDK build command when the GregTech addon SDK jar is missing.'
    group = 'verification'
    doFirst {
        if (!neoApi.isFile() || !neoSdk.isFile()) {
            throw new GradleException("Missing GregTech addon API jars:\n  ${neoApi.absolutePath}\n  ${neoSdk.absolutePath}\nBuild them from the GregTech6 checkout:\n  gradlew.bat :api:assemble :minecraft:1.21.1-neoforge:addonSdkJar")
        }
    }
}
tasks.named('compileJava').configure { dependsOn 'requireSdk' }
tasks.named('compileTestJava').configure { dependsOn 'requireSdk' }

def unitTest = tasks.register('unitTest', JavaExec) {
    description = 'Runs pure-JVM pool reaction and crucible behavior tests.'
    group = 'verification'
    dependsOn 'testClasses'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = files(sourceSets.test.output, sourceSets.main.output, sourceSets.main.compileClasspath)
    mainClass = 'com.lombinaxmasson.ssite.machine.MoltenPoolTests'
    jvmArgs '-ea'
}
tasks.named('check').configure { dependsOn unitTest }
apply from: rootProject.file('gradle/furnace-render-test.gradle')

tasks.register('requireRuntime') {
    description = 'Fail with the jar command when the dev game has no GregTech mod jar.'
    group = 'verification'
    doFirst {
        if (!neoRuntime.isFile()) {
            throw new GradleException("Missing GregTech NeoForge jar for the dev game:\n  ${neoRuntime.absolutePath}\nBuild it from the GregTech6 checkout:\n  gradlew.bat :minecraft:1.21.1-neoforge:build\nOr copy that jar into libs/ with the same file name.")
        }
    }
}
// ModDevGradle registers these run tasks after project evaluation.
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer') {
        dependsOn 'requireRuntime'
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            mod_id             : mod_id,
            mod_name           : mod_name,
            mod_version        : mod_version,
            mod_license        : mod_license,
            mod_authors        : mod_authors,
            gt6ce_version_range: "[${gt6ce_version},)",
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
    // 1.21 moved data/<ns>/recipes/ to data/<ns>/recipe/ and crafting result.item to result.id.
    filesMatching(['data/ssite/recipes/*.json']) {
        path = path.replace('data/ssite/recipes/', 'data/ssite/recipe/')
        filter { String line ->
            // Only the four-space result line becomes "id"; ingredient entries stay "item".
            line.replace('"result": {', '"result": { "count": 1,')
                .replaceAll('^    "item": "ssite:', '    "id": "ssite:')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

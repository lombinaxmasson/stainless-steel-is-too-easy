plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-neoforge-1.21.1"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

apply from: rootProject.file('gradle/gt6ce-sdk.gradle')

def neoSdk = resolveGt6ce("multiversion/versions/1.21.1-neoforge/build/addon-sdk/gt6ce-addon-sdk-1.21.1-neoforge-${gt6ce_version}.jar")
def neoRuntime = resolveGt6ce("multiversion/versions/1.21.1-neoforge/build/libs/gt6ce-neoforge-1.21.1-${gt6ce_version}.jar")

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly files(neoSdk)
    if (neoRuntime.isFile()) {
        runtimeOnly files(neoRuntime)
    }
}

tasks.register('requireSdk') {
    description = 'Fail with the SDK build command when the GregTech addon SDK jar is missing.'
    group = 'verification'
    doFirst {
        if (!neoSdk.isFile()) {
            throw new GradleException("Missing GregTech addon SDK:\n  ${neoSdk.absolutePath}\nBuild it from the GregTech6 checkout:\n  gradlew.bat :multiversion:1.21.1-neoforge:addonSdkJar")
        }
    }
}
tasks.named('compileJava').configure { dependsOn 'requireSdk' }

tasks.register('requireRuntime') {
    description = 'Fail with the jar command when the dev game has no GregTech mod jar.'
    group = 'verification'
    doFirst {
        if (!neoRuntime.isFile()) {
            throw new GradleException("Missing GregTech NeoForge jar for the dev game:\n  ${neoRuntime.absolutePath}\nBuild it from the GregTech6 checkout:\n  gradlew.bat :multiversion:1.21.1-neoforge:build\nOr copy that jar into libs/ with the same file name.")
        }
    }
}
// ModDevGradle registers these run tasks after project evaluation.
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer') {
        dependsOn 'requireRuntime'
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            mod_id       : mod_id,
            mod_name     : mod_name,
            mod_version  : mod_version,
            mod_license  : mod_license,
            mod_authors  : mod_authors,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

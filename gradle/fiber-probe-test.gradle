def fiberProbeTest = tasks.register('fiberProbeTest', JavaExec) {
    description = 'Checks the fiber probe snapshot, stop reasons, pulse and target loss.'
    group = 'verification'
    dependsOn 'testClasses'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = files(sourceSets.test.output, sourceSets.main.output, sourceSets.main.compileClasspath)
    mainClass = 'com.lombinaxmasson.ssite.machine.FiberProbeTests'
    jvmArgs '-ea'
}
tasks.named('check').configure { dependsOn fiberProbeTest }

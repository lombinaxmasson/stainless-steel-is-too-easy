def heatTransportTest = tasks.register('heatTransportTest', JavaExec) {
    description = 'Checks bounded HU routing, plate sharing and transmission conservation.'
    group = 'verification'
    dependsOn 'testClasses'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    classpath = files(sourceSets.test.output, sourceSets.main.output, sourceSets.main.compileClasspath)
    mainClass = 'com.lombinaxmasson.ssite.machine.HeatTransportTests'
    jvmArgs '-ea'
}
tasks.named('check').configure { dependsOn heatTransportTest }

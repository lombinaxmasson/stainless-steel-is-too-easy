plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group

base {
    archivesName = "${mod_id}-${minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

apply from: rootProject.file('gradle/gt6ce-sdk.gradle')

def forgeSdk = resolveGt6ce("multiversion/versions/1.20.1-forge/build/addon-sdk/gt6ce-addon-sdk-${minecraft_version}-forge-${gt6ce_version}.jar")
def forgeRuntime = resolveGt6ce("multiversion/versions/1.20.1-forge/build/libs/gt6ce-${minecraft_version}-forge-${gt6ce_version}.jar")

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {
    if (forgeRuntime.isFile()) {
        flatDir { dir forgeRuntime.parentFile }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files(forgeSdk)
    if (forgeRuntime.isFile()) {
        // The Forge release jar is SRG. flatDir lets fg.deobf remap it for the Mojang-named dev game.
        runtimeOnly fg.deobf("blank:gt6ce-${minecraft_version}-forge:${gt6ce_version}")
    }
}

tasks.register('requireSdk') {
    description = 'Fail with the SDK build command when the GregTech addon SDK jar is missing.'
    group = 'verification'
    doFirst {
        if (!forgeSdk.isFile()) {
            throw new GradleException("Missing GregTech addon SDK:\n  ${forgeSdk.absolutePath}\nBuild it from the GregTech6 checkout:\n  gradlew.bat :multiversion:1.20.1-forge:addonSdkJar")
        }
    }
}
tasks.named('compileJava').configure { dependsOn 'requireSdk' }

tasks.register('requireRuntime') {
    description = 'Fail with the distribution-jar command when the dev game has no GregTech mod jar.'
    group = 'verification'
    doFirst {
        if (!forgeRuntime.isFile()) {
            throw new GradleException("Missing GregTech Forge jar for the dev game:\n  ${forgeRuntime.absolutePath}\nBuild it from the GregTech6 checkout:\n  gradlew.bat :multiversion:1.20.1-forge:distributionJar\nOr copy that jar into libs/ with the same file name.")
        }
    }
}
// ForgeGradle registers these run tasks after project evaluation.
tasks.configureEach {
    if (name == 'runClient' || name == 'runServer') {
        dependsOn 'requireRuntime'
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            loader_version_range   : '[47,)',
            minecraft_version_range: '[1.20.1,1.21)',
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

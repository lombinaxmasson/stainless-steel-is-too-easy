# Gradle 8.8 does not start on Java 25. Launch it with JDK 17.
# scripts/build.ps1 finds JDK 17 and JDK 21, then sets JAVA_HOME.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.daemon=true
org.gradle.java.installations.fromEnv=JAVA17_HOME,JAVA21_HOME
org.gradle.java.installations.auto-detect=true

mod_id=ssite
mod_name=Stainless Steel is Too Easy
mod_version=0.1.0
mod_group=com.lombinaxmasson.ssite
mod_license=LGPL-3.0-or-later
mod_authors=lombinaxmasson

# GregTech 6 Community Edition checkout. Override with -Pgt6ceDir=.
# Distribution jar version follows GregTech6's mod_version.
gt6ce_version=0.1.0
# The extracted API submodule versions common + platform artifacts independently.
gt6ce_api_version=0.2.0
minecraft_version=1.20.1
forge_version=47.4.20
neoforge_version=21.1.243
